<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Ninfinity</title>
<link rel="icon" href="assets/logo.png">
<style>
  /* Colors pulled directly from the app's res/values/themes.xml and drawables,
     so this page reads as part of Mod Ninstaller rather than an external site. */
  :root {
    --bg: #1a1a2e;
    --card-bg: #16213e;
    --card-border: #0f3460;
    --accent: #e94560;
    --text-primary: #ffffff;
    --text-muted: #888888;
    --text-dim: #666666;
    --text-faint: #555555;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Roboto, "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 480px;
  }

  .app-header {
    display: flex;
    align-items: center;
    margin: 12px 0 20px;
  }
  .app-header img {
    width: 44px;
    height: 44px;
    object-fit: contain;
    margin-right: 14px;
    flex-shrink: 0;
  }
  .app-title {
    font-size: 20px;
    font-weight: bold;
    color: var(--accent);
    line-height: 1.2;
  }
  .app-subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .section {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-faint);
    margin: 0 0 16px;
  }

  .rate-display {
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    letter-spacing: -0.01em;
    color: var(--accent);
    margin-bottom: 18px;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--card-border);
    outline: none;
    margin: 8px 0 4px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 1px var(--card-border);
  }
  input[type="range"]::-moz-range-thumb {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 3px solid var(--bg);
  }
  .rate-bounds {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
  }

  .preview-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1200 / 540;
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg);
    margin-bottom: 20px;
    border: 1px solid var(--card-border);
  }
  .preview-wrap img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
  }
  .preview-wrap img.active {
    opacity: 1;
  }
  .preview-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--text-muted);
  }

  button.generate {
    width: 100%;
    padding: 15px;
    font-size: 15px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--text-primary);
    cursor: pointer;
    transition: filter .15s ease, transform .1s ease;
  }
  button.generate:hover { filter: brightness(1.08); }
  button.generate:active { transform: scale(0.99); }
  button.generate:disabled {
    background: var(--card-border);
    color: var(--text-muted);
    cursor: not-allowed;
  }

  .status {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    color: var(--text-muted);
    min-height: 18px;
  }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <div class="app-header">
      <img src="assets/logo.png" alt="Ninfinity">
      <div>
        <div class="app-title">Camera Ninfinity</div>
        <div class="app-subtitle">Liên Quân Mobile - by Ninfinity</div>
      </div>
    </div>

    <div class="section">
      <p class="section-title">Hệ số camera</p>
      <div class="rate-display" id="rateDisplay">Mặc định</div>
      <div class="preview-wrap" id="previewWrap">
        <span class="preview-loading">Đang tải ảnh...</span>
      </div>
      <input type="range" id="rateSlider" min="1" max="5" step="0.5" value="1">
      <div class="rate-bounds">
        <span>x1</span>
        <span>x5</span>
      </div>
    </div>

    <button class="generate" id="generateBtn">Tạo &amp; tải file</button>
    <p class="status" id="status"></p>
  </div>

<script>
const slider = document.getElementById('rateSlider');
const rateDisplay = document.getElementById('rateDisplay');
const generateBtn = document.getElementById('generateBtn');
const statusEl = document.getElementById('status');
const previewWrap = document.getElementById('previewWrap');

const MIN = 1.0, MAX = 5.0, STEP = 0.5;

// Preload all 9 preview images (1.0, 1.5, ... 5.0) keyed by fixed-point string
const previewLevels = [];
for (let v = MIN; v <= MAX + 1e-9; v += STEP) {
  previewLevels.push(Math.round(v * 10) / 10);
}
const previewImgs = {};
previewLevels.forEach(level => {
  const img = document.createElement('img');
  img.src = `preview/${level.toFixed(1)}.jpg`;
  img.alt = `Preview x${level}`;
  previewWrap.appendChild(img);
  previewImgs[level.toFixed(1)] = img;
});
// Remove loading label once the first image is ready (or on error, still remove)
const firstImg = previewImgs[MIN.toFixed(1)];
const clearLoading = () => {
  const loading = previewWrap.querySelector('.preview-loading');
  if (loading) loading.remove();
};
firstImg.addEventListener('load', clearLoading);
firstImg.addEventListener('error', clearLoading);

function updatePreview(value) {
  const key = value.toFixed(1);
  Object.entries(previewImgs).forEach(([k, img]) => {
    img.classList.toggle('active', k === key);
  });
}

function formatMultiplier(value) {
  if (Math.abs(value - MIN) < 1e-6) return 'Mặc định';
  return 'x' + value.toFixed(1);
}

function snapToStep(value) {
  let snapped = Math.round(value / STEP) * STEP;
  snapped = Math.min(MAX, Math.max(MIN, snapped));
  return Math.round(snapped * 1000) / 1000;
}

let currentRate = 1.0;

function setRate(value) {
  currentRate = snapToStep(value);
  slider.value = currentRate;
  rateDisplay.textContent = formatMultiplier(currentRate);
  updatePreview(currentRate);
}

slider.addEventListener('input', () => {
  setRate(parseFloat(slider.value));
});

generateBtn.addEventListener('click', async () => {
  statusEl.textContent = '';
  statusEl.className = 'status';
  generateBtn.disabled = true;
  generateBtn.textContent = 'Đang xử lý...';

  try {
    const params = new URLSearchParams({
      height_rate: currentRate.toFixed(3),
    });
    const res = await fetch('/api/generate?' + params.toString());
    if (!res.ok) {
      const err = await res.json().catch(() => ({detail: 'Lỗi không xác định'}));
      throw new Error(err.detail || 'Lỗi không xác định');
    }

    // Extract filename from Content-Disposition header (supports UTF-8 via filename*)
    let filename = 'download.zip';
    const disposition = res.headers.get('Content-Disposition') || '';
    const utf8Match = disposition.match(/filename\*=UTF-8''([^;]+)/i);
    if (utf8Match) {
      filename = decodeURIComponent(utf8Match[1]);
    } else {
      const asciiMatch = disposition.match(/filename="([^"]+)"/i);
      if (asciiMatch) filename = asciiMatch[1];
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    statusEl.textContent = 'Đã tạo xong, đang tải xuống...';
    statusEl.className = 'status ok';
  } catch (e) {
    statusEl.textContent = 'Lỗi: ' + e.message;
    statusEl.className = 'status error';
  } finally {
    generateBtn.disabled = false;
    generateBtn.textContent = 'Tạo & tải file';
  }
});

// Initialize preview with the default rate
updatePreview(currentRate);
</script>
</body>
</html>
